name: CI Pipeline - Integration & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  code-quality-and-test:
    name: Lint, Test and Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment (${{ matrix.node-version }})
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 3. Install Dependencies
        run: npm ci

      - name: 4. Run ESLint (Linting)
        run: npm run lint

      - name: 5. Run Unit Tests
        run: npm test

      - name: 6. Build Production Artifact
        run: npm run build